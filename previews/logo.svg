<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="50%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(40, 20) scale(0.47)">
    <rect width="512" height="512" rx="112" fill="#10131c"/>
    <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
    
    <!-- Glow -->
    <circle cx="230" cy="250" r="140" fill="url(#brandGrad)" opacity="0.35" filter="url(#markGlow)"/>

    <!-- Vinyl -->
    <g transform="translate(230, 256)">
      <circle r="148" fill="#15171e" stroke="url(#brandGrad)" stroke-width="4"/>
      <circle r="132" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <circle r="118" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <circle r="104" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
      <circle r="56" fill="url(#brandGrad)"/>
      <circle r="18" fill="#0b0d13" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    </g>

    <!-- Brush Arc -->
    <path d="M 140 370 C 110 300, 110 190, 190 130 C 270 70, 380 90, 410 160 C 425 195, 415 240, 380 270 C 340 305, 290 310, 245 285 C 275 270, 300 240, 310 200 C 325 140, 250 120, 205 160 C 160 200, 160 280, 200 340 C 175 355, 155 365, 140 370 Z" 
          fill="#ffffff" opacity="0.95"/>
    <path d="M 370 145 C 385 125, 415 110, 430 115 C 435 130, 420 160, 400 170 C 385 165, 375 155, 370 145 Z" fill="#ffffff"/>
  </g>

  <!-- Wordmark & Tagline -->
  <text x="320" y="145" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
        font-size="82" 
        font-weight="900" 
        letter-spacing="-2px" 
        fill="url(#textGrad)">AlbumCanvas</text>
  
  <text x="325" y="195" 
        font-family="system-ui, -apple-system, 'Inter', sans-serif" 
        font-size="24" 
        font-weight="600" 
        letter-spacing="0.5px" 
        fill="#94a3b8">REAL-TIME MUSIC WALLPAPER ENGINE</text>
</svg>
